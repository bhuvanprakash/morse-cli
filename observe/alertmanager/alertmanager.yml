global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alertmanager@indusbase.io'
  smtp_auth_username: 'alertmanager'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

# Template files for custom alert notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route configuration - defines how alerts are grouped and routed
route:
  group_by: ['alertname', 'job', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 0s
      repeat_interval: 1h

    # Platform team alerts
    - match:
        team: platform
      receiver: 'platform-receiver'
      routes:
        - match:
            severity: warning
          receiver: 'platform-receiver'
          continue: true
        - match:
            severity: critical
          receiver: 'critical-receiver'

    # Security/auth alerts
    - match:
        team: security
      receiver: 'security-receiver'
      routes:
        - match:
            alertname: HighAuthFailureRate
          receiver: 'security-receiver'
          continue: true
        - match:
            alertname: HighAuthFailureRate
          receiver: 'pagerduty-critical'

    # AI team alerts
    - match:
        team: ai
      receiver: 'ai-receiver'

# Inhibition rules - suppress alerts when other alerts are firing
inhibit_rules:
  # Inhibit high latency alerts when service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: 'High.*Latency|HighErrorRate'
    equal: ['job']

  # Inhibit all alerts when entire cluster is down
  - source_match:
      alertname: 'ClusterDown'
    target_match_re:
      alertname: '.*'
    equal: ['cluster']

# Receivers - notification destinations
receivers:
  # Default receiver (all alerts)
  - name: 'default-receiver'
    email_configs:
      - to: 'alerts@indusbase.io'
        send_resolved: true
        headers:
          subject: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }} - IndusBase'
    webhook_configs:
      - url: 'http://webhook-server:5000/alerts'
        send_resolved: true

  # Critical alerts - goes to PagerDuty and urgent email
  - name: 'critical-receiver'
    email_configs:
      - to: 'urgent@indusbase.io'
        send_resolved: true
        headers:
          subject: '[CRITICAL] {{ .GroupLabels.alertname }} - IndusBase'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        severity: critical
        component: 'indusbase'
        group: '{{ .GroupLabels.alertname }}'
        description: '{{ .Annotations.summary }}'
        details:
          environment: 'production'
          cluster: 'indusbase'
    webhook_configs:
      - url: 'http://slack-webhook:5000/critical'
        send_resolved: true

  # Platform team alerts
  - name: 'platform-receiver'
    email_configs:
      - to: 'platform@indusbase.io'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#indusbase-platform'
        title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        text: '{{ .Annotations.description }}'
        footer: 'IndusBase Observability'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  # Security team alerts
  - name: 'security-receiver'
    email_configs:
      - to: 'security@indusbase.io'
        send_resolved: true
        headers:
          subject: '[SECURITY] {{ .GroupLabels.alertname }} - IndusBase'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#indusbase-security'
        title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        text: '{{ .Annotations.description }}'
        footer: 'IndusBase Observability'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  # AI team alerts
  - name: 'ai-receiver'
    email_configs:
      - to: 'ai-team@indusbase.io'
        send_resolved: true

  # PagerDuty critical for auth failures
  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        severity: critical
        component: 'indusbase-auth'
        group: 'authentication'
        description: '{{ .Annotations.summary }}'
        details:
          environment: 'production'

