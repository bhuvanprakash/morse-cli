apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 60s
      cacheTimeout: 30s
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 2.51.0
      enableHttp2: true
      tlsSkipVerify: false
    version: 1

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: request_id
          matcherRegex: '"request_id":"(\w+)"'
          url: ""
          datasourceUid: prometheus
