server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: indusbase-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values:
              - indusbase-indus-gate
              - indusbase-indus-auth
              - indusbase-indus-query
              - indusbase-indus-meta
              - indusbase-indus-live
              - indusbase-indus-store
              - indusbase-indus-edge
              - indusbase-indus-ai
              - indusbase-indus-queue
              - indusbase-indus-notify
              - indusbase-indus-config
              - indusbase-indus-audit
              - indusbase-indus-billing
              - indusbase-indus-secrets
              - indusbase-indus-status
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/indusbase-(.*)'
        target_label: service
        replacement: '$1'
      - source_labels: ['__meta_docker_container_id']
        target_label: container_id
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            request_id: request_id
            duration_ms: duration_ms
            status: status
            path: path
      - labels:
          level:
          service:
      - drop:
          expression: '.*GET /health.*'
      - drop:
          expression: '.*GET /metrics.*'
