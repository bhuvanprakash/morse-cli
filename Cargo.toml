[package]
name = "morse-cli-rs"
version = "1.0.0"
edition = "2021"

# Install as `morse` (matches the docs / Go CLI), not `morse-cli-rs`.
[[bin]]
name = "morse"
path = "src/main.rs"

[lib]
name = "morse_cli_rs"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
futures-util = "0.3"
duckdb = { version = "1", features = ["bundled"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
regex = "1"
async-trait = "0.1"
glob = "0.3"
walkdir = "2"
ratatui = { version = "0.26", features = ["crossterm"] }
crossterm = "0.27"
directories = "5"
rand = "0.8"
console = "0.15"
indicatif = "0.17"
dialoguer = "0.11"
colored = "2.0"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
