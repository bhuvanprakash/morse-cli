[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indusbase-py"
version = "0.1.0"
description = "IndusBase Python client — India's Postgres-native BaaS SDK"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "IndusBase Team", email = "dev@indusbase.com" }
]
keywords = ["database", "baas", "postgresql", "api", "ai", "rag", "indian", "upstack"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.0",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/indusbase/indusbase-py"
Repository = "https://github.com/indusbase/indusbase-py"
Documentation = "https://docs.indusbase.com"

[tool.hatch.build.targets.wheel]
packages = ["indusbase"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
