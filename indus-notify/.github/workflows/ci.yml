name: indus-notify CI

on:
  push:
    paths:
      - "indus-notify/**"
  pull_request:
    paths:
      - "indus-notify/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indus-notify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go mod tidy
      - run: go test ./...
