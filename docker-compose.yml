version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: indus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-indus_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indus_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-indusbase}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - indusbase_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-indus_admin} -d ${POSTGRES_DB:-indusbase}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/server.crt
      -c ssl_key_file=/etc/ssl/private/server.key
      -c log_statement=all
      -c log_duration=on
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

  # Redis Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: indus-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-indus_redis_pass}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - indusbase_net
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Connection Pool Service (PostgreSQL Proxy)
  indus-pool:
    build:
      context: ./services/pool
      dockerfile: Dockerfile
    container_name: indus-pool
    restart: unless-stopped
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-indus_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-indus_secure_pass}
      DB_NAME: ${POSTGRES_DB:-indusbase}
      DB_SSL_MODE: require
      DB_POOL_SIZE: ${DB_POOL_SIZE:-100}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-200}
      # Internal Auth
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal_secure_key}
      AUTH_SERVICE_URL: http://indus-auth:8001
      # Metrics
      METRICS_PORT: 9090
      METRICS_ENABLED: "true"
      # TLS
      TLS_CERT_PATH: ${TLS_CERT_PATH:-/certs/server.crt}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-/certs/server.key}
    ports:
      - "5433:5432"  # PgBouncer-like port
      - "9090:9090"  # Metrics port
    volumes:
      - ./certs:/certs:ro
    networks:
      - indusbase_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Authentication Service
  indus-auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: indus-auth
    restart: unless-stopped
    environment:
      # Service
      PORT: 8001
      HOST: 0.0.0.0
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: ${RUST_BACKTRACE:-1}
      # Database (via pool)
      DATABASE_URL: postgres://${POSTGRES_USER:-indus_admin}:${POSTGRES_PASSWORD:-indus_secure_pass}@indus-pool:5432/${POSTGRES_DB:-indusbase}
      DB_POOL_SIZE: 10
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-indus_redis_pass}@redis:6379/0
      # JWT
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your_refresh_secret_key_change_in_production}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      JWT_ISSUER: ${JWT_ISSUER:-indusbase}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-indusbase.io}
      # OAuth - Google
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8001/auth/google/callback}
      # OAuth - GitHub
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8001/auth/github/callback}
      # OAuth - Microsoft
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8001/auth/microsoft/callback}
      # SMTP
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@indusbase.io}
      SMTP_TLS: ${SMTP_TLS:-true}
      # Internal Auth
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal_secure_key}
      # Rate Limiting
      RATE_LIMIT_REQ_PER_SEC: ${RATE_LIMIT_REQ_PER_SEC:-10}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
      # TLS
      TLS_CERT_PATH: ${TLS_CERT_PATH:-}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-}
    ports:
      - "8001:8001"
    networks:
      - indusbase_net
    depends_on:
      indus-pool:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Query Service
  indus-query:
    build:
      context: ./services/query
      dockerfile: Dockerfile
    container_name: indus-query
    restart: unless-stopped
    environment:
      # Service
      PORT: 8002
      HOST: 0.0.0.0
      RUST_LOG: ${RUST_LOG:-info}
      # Database (via pool)
      DATABASE_URL: postgres://${POSTGRES_USER:-indus_admin}:${POSTGRES_PASSWORD:-indus_secure_pass}@indus-pool:5432/${POSTGRES_DB:-indusbase}
      DB_POOL_SIZE: 20
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-indus_redis_pass}@redis:6379/0
      REDIS_RESULT_CACHE_TTL: ${REDIS_RESULT_CACHE_TTL:-300}
      # Query Settings
      QUERY_MAX_EXECUTION_TIME_MS: ${QUERY_MAX_EXECUTION_TIME_MS:-30000}
      QUERY_MAX_ROWS_RETURNED: ${QUERY_MAX_ROWS_RETURNED:-10000}
      QUERY_STATEMENT_TIMEOUT_MS: ${QUERY_STATEMENT_TIMEOUT_MS:-25000}
      QUERY_ALLOW_DDL: ${QUERY_ALLOW_DDL:-false}
      QUERY_ALLOW_DML: ${QUERY_ALLOW_DML:-true}
      QUERY_LOG_SLOW_THRESHOLD_MS: ${QUERY_LOG_SLOW_THRESHOLD_MS:-1000}
      # Internal Auth
      AUTH_SERVICE_URL: http://indus-auth:8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal_secure_key}
      # Rate Limiting
      RATE_LIMIT_REQ_PER_SEC: ${RATE_LIMIT_REQ_PER_SEC:-100}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-200}
      # TLS
      TLS_CERT_PATH: ${TLS_CERT_PATH:-}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-}
    ports:
      - "8002:8002"
    networks:
      - indusbase_net
    depends_on:
      indus-pool:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Metadata Service
  indus-meta:
    build:
      context: ./services/meta
      dockerfile: Dockerfile
    container_name: indus-meta
    restart: unless-stopped
    environment:
      # Service
      PORT: 8003
      HOST: 0.0.0.0
      RUST_LOG: ${RUST_LOG:-info}
      # Database (via pool)
      DATABASE_URL: postgres://${POSTGRES_USER:-indus_admin}:${POSTGRES_PASSWORD:-indus_secure_pass}@indus-pool:5432/${POSTGRES_DB:-indusbase}
      DB_POOL_SIZE: 10
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-indus_redis_pass}@redis:6379/1
      REDIS_SCHEMA_CACHE_TTL: ${REDIS_SCHEMA_CACHE_TTL:-60}
      # Metadata Settings
      META_CACHE_TTL_SECONDS: ${META_CACHE_TTL_SECONDS:-60}
      META_ENABLE_SCHEMA_INTROSPECTION: ${META_ENABLE_SCHEMA_INTROSPECTION:-true}
      # Internal Auth
      AUTH_SERVICE_URL: http://indus-auth:8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal_secure_key}
      # Rate Limiting
      RATE_LIMIT_REQ_PER_SEC: ${RATE_LIMIT_REQ_PER_SEC:-50}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-100}
      # TLS
      TLS_CERT_PATH: ${TLS_CERT_PATH:-}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-}
    ports:
      - "8003:8003"
    networks:
      - indusbase_net
    depends_on:
      indus-pool:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # API Gateway
  indus-gate:
    build:
      context: ./services/gate
      dockerfile: Dockerfile
    container_name: indus-gate
    restart: unless-stopped
    environment:
      # Service
      PORT: 8000
      HOST: 0.0.0.0
      RUST_LOG: ${RUST_LOG:-info}
      # Upstream Services
      AUTH_SERVICE_URL: http://indus-auth:8001
      QUERY_SERVICE_URL: http://indus-query:8002
      META_SERVICE_URL: http://indus-meta:8003
      POOL_SERVICE_URL: http://indus-pool:5432
      UPSTREAM_AUDIT: http://indus-audit:8011
      UPSTREAM_BILLING: http://indus-billing:8012
      UPSTREAM_SECRETS: http://indus-secrets:8013
      UPSTREAM_STATUS: http://indus-status:8014
      # Gateway Settings
      GATEWAY_TIMEOUT_SECONDS: ${GATEWAY_TIMEOUT_SECONDS:-30}
      GATEWAY_MAX_REQUEST_SIZE_MB: ${GATEWAY_MAX_REQUEST_SIZE_MB:-10}
      GATEWAY_ENABLE_CORS: ${GATEWAY_ENABLE_CORS:-true}
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      # Rate Limiting
      RATE_LIMIT_REQ_PER_SEC: ${GATEWAY_RATE_LIMIT_REQ_PER_SEC:-1000}
      RATE_LIMIT_BURST: ${GATEWAY_RATE_LIMIT_BURST:-2000}
      # TLS
      TLS_CERT_PATH: ${TLS_CERT_PATH:-/certs/server.crt}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-/certs/server.key}
      TLS_ENABLED: ${TLS_ENABLED:-false}
      # Internal Auth
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal_secure_key}
    ports:
      - "8000:8000"
    volumes:
      - ./certs:/certs:ro
    networks:
      - indusbase_net
    depends_on:
      indus-auth:
        condition: service_healthy
      indus-query:
        condition: service_healthy
      indus-meta:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  indus-live:
    build: ./indus-live
    ports: ["8004:8004"]
    environment:
      - DATABASE_URL=postgresql://indusbase:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - POSTGRES_REPLICATION_URL=postgresql://indusbase_replication:${DB_REPLICATION_PASSWORD}@postgres:5432/${DB_NAME}?replication=database
      - SERVER_PORT=8004
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public_key
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - MAX_CONNECTIONS_PER_TOPIC=1000
    depends_on: [indus-pool]
    networks: [indusbase_net]

  indus-store:
    build: ./indus-store
    ports: ["8005:8005"]
    environment:
      - DATABASE_URL=postgresql://indusbase:${DB_PASSWORD}@indus-pool:5432/${DB_NAME}
      - SERVER_PORT=8005
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public_key
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - LOCAL_STORAGE_PATH=/var/indusbase/storage
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-indusbase}
      - S3_REGION=${S3_REGION:-ap-south-1}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - SIGNED_URL_EXPIRY_SECS=${SIGNED_URL_EXPIRY_SECS:-3600}
    volumes: ["indusbase_storage:/var/indusbase/storage"]
    depends_on: [indus-pool]
    networks: [indusbase_net]

  indus-edge:
    build:
      context: ./indus-edge
      dockerfile: Dockerfile
    container_name: indus-edge
    ports: ["8006:8006"]
    environment:
      - SERVER_PORT=8006
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - INDUSBASE_API_URL=http://indus-gate:8000
      - SECRETS_SERVICE_URL=http://indus-secrets:8013
      - WORKER_MEMORY_LIMIT_MB=${WORKER_MEMORY_LIMIT_MB:-512}
      - WORKER_TIMEOUT_MS=${WORKER_TIMEOUT_MS:-30000}
      - WARMPOOL_SIZE=${WARMPOOL_SIZE:-5}
      - BUN_BINARY_PATH=/usr/local/bin/bun
    volumes:
      - indusbase_functions:/var/indusbase/functions
    depends_on: [indus-gate]
    networks: [indusbase_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  indus-ai:
    build: ./indus-ai
    ports: ["8007:8007"]
    environment:
      - DATABASE_URL=postgresql://indusbase:${DB_PASSWORD}@indus-pool:5432/${DB_NAME}
      - SERVER_PORT=8007
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-local}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=nomic-embed-text
    depends_on: [indus-pool]
    networks: [indusbase_net]

  indus-queue:
    build: ./indus-queue
    ports: ["8008:8008"]
    environment:
      - DATABASE_URL=postgresql://indusbase:${DB_PASSWORD}@indus-pool:5432/${DB_NAME}
      - SERVER_PORT=8008
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - AUTH_SERVICE_URL=http://indus-auth:8001
      - LIVE_SERVICE_URL=http://indus-live:8004
      - MAX_CONCURRENT_WORKERS=50
      - POLL_INTERVAL_MS=1000
    depends_on: [indus-pool, indus-live]
    networks: [indusbase_net]

  indus-notify:
    build:
      context: ./indus-notify
      dockerfile: Dockerfile
    container_name: indusbase-indus-notify
    ports:
      - "8009:8009"
    environment:
      - SERVER_PORT=8009
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - AUTH_SERVICE_URL=http://indus-auth:8001
      - QUEUE_SERVICE_URL=http://indus-queue:8008
      - FCM_CREDENTIALS_JSON=${FCM_CREDENTIALS_JSON}
      - APNS_KEY_P8=${APNS_KEY_P8}
      - APNS_KEY_ID=${APNS_KEY_ID}
      - APNS_TEAM_ID=${APNS_TEAM_ID}
      - APNS_BUNDLE_ID=${APNS_BUNDLE_ID}
      - TWOFACTOR_API_KEY=${TWOFACTOR_API_KEY}
      - TWOFACTOR_SENDER_ID=${TWOFACTOR_SENDER_ID}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-IndusBase}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-noreply@indusbase.com}
    depends_on:
      - postgres
      - indus-queue
    networks:
      - indusbase_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  indus-config:
    build:
      context: ./indus-config
      dockerfile: Dockerfile
    container_name: indusbase-indus-config
    ports:
      - "8010:8010"
    environment:
      - SERVER_PORT=8010
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - CONFIG_ENCRYPTION_KEY=${CONFIG_ENCRYPTION_KEY:-change_this_32_char_key_in_prod!!}
    depends_on:
      - postgres
    networks:
      - indusbase_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  indus-audit:
    build:
      context: ./indus-audit
      dockerfile: Dockerfile
    container_name: indusbase-indus-audit
    ports:
      - "8011:8011"
    environment:
      - SERVER_PORT=8011
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    depends_on:
      - postgres
    networks:
      - indusbase_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  indus-billing:
    build:
      context: ./indus-billing
      dockerfile: Dockerfile
    container_name: indusbase-indus-billing
    ports:
      - "8012:8012"
    environment:
      - SERVER_PORT=8012
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    depends_on:
      - postgres
    networks:
      - indusbase_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8012/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  indus-secrets:
    build:
      context: ./indus-secrets
      dockerfile: Dockerfile
    container_name: indusbase-indus-secrets
    ports:
      - "8013:8013"
    environment:
      - SERVER_PORT=8013
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - PLATFORM_ENCRYPTION_KEY=${PLATFORM_ENCRYPTION_KEY}
    depends_on:
      - postgres
    networks:
      - indusbase_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8013/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  indus-status:
    build:
      context: ./indus-status
      dockerfile: Dockerfile
    container_name: indusbase-indus-status
    ports:
      - "8014:8014"
    environment:
      - SERVER_PORT=8014
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - STATUS_PUBLIC_BASE_URL=${STATUS_PUBLIC_BASE_URL:-http://localhost:8000}
      - SUPPORT_CONTACT_EMAIL=${SUPPORT_CONTACT_EMAIL:-support@indusbase.com}
    depends_on:
      - postgres
    networks:
      - indusbase_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8014/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    container_name: indusbase-docs
    ports:
      - "4321:80"
    networks:
      - indusbase_net
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: indusbase-ollama
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
    networks: [indusbase_net]
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull nomic-embed-text && wait"]

  indus-studio:
    build: ./indus-studio
    ports: ["3000:3000"]
    environment:
      - PUBLIC_INDUSBASE_URL=http://localhost:8000
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - NODE_ENV=production
    depends_on: [indus-gate]
    networks: [indusbase_net]

volumes:
  indusbase_storage:
  indusbase_functions:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  indusbase_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
