name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ============================================================================
  # Extract Version
  # ============================================================================
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

  # ============================================================================
  # Build and Push Docker Images
  # ============================================================================
  build-images:
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: gate
            context: ./indus-gate
            dockerfile: ./indus-gate/Dockerfile
          - name: auth
            context: ./indus-auth
            dockerfile: ./indus-auth/Dockerfile
          - name: query
            context: ./indus-query
            dockerfile: ./indus-query/Dockerfile
          - name: pool
            context: ./indus-pool
            dockerfile: ./indus-pool/Dockerfile
          - name: meta
            context: ./indus-meta
            dockerfile: ./indus-meta/Dockerfile
          - name: live
            context: ./indus-live
            dockerfile: ./indus-live/Dockerfile
          - name: store
            context: ./indus-store
            dockerfile: ./indus-store/Dockerfile
          - name: studio
            context: ./indus-studio
            dockerfile: ./indus-studio/Dockerfile

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ============================================================================
  # Build CLI Binaries
  # ============================================================================
  build-cli:
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            platform: linux-amd64
          - goos: linux
            goarch: arm64
            platform: linux-arm64
          - goos: darwin
            goarch: amd64
            platform: darwin-amd64
          - goos: darwin
            goarch: arm64
            platform: darwin-arm64
          - goos: windows
            goarch: amd64
            platform: windows-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build CLI binary
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          output_name="indus-${{ matrix.platform }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            output_name="${output_name}.exe"
          fi
          go build -ldflags "-X main.Version=${{ needs.version.outputs.version }}" -o "../dist/${output_name}" ./...

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: dist/indus-${{ matrix.platform }}*

  # ============================================================================
  # Create Release
  # ============================================================================
  release:
    runs-on: ubuntu-latest
    needs: [version, build-images, build-cli]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cli-*

      - name: Create checksums
        run: |
          cd dist
          for dir in cli-*; do
            if [ -d "$dir" ]; then
              mv "$dir"/* .
              rmdir "$dir"
            fi
          done
          sha256sum indus-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ needs.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            dist/indus-*
            dist/checksums.txt
          body: |
            ## Docker Images

            All services are available as Docker images:

            ```bash
            # Pull images
            docker pull ${{ env.IMAGE_PREFIX }}/gate:${{ needs.version.outputs.version }}
            docker pull ${{ env.IMAGE_PREFIX }}/auth:${{ needs.version.outputs.version }}
            docker pull ${{ env.IMAGE_PREFIX }}/query:${{ needs.version.outputs.version }}
            docker pull ${{ env.IMAGE_PREFIX }}/pool:${{ needs.version.outputs.version }}
            docker pull ${{ env.IMAGE_PREFIX }}/meta:${{ needs.version.outputs.version }}
            docker pull ${{ env.IMAGE_PREFIX }}/live:${{ needs.version.outputs.version }}
            docker pull ${{ env.IMAGE_PREFIX }}/store:${{ needs.version.outputs.version }}
            docker pull ${{ env.IMAGE_PREFIX }}/studio:${{ needs.version.outputs.version }}
            ```

            ## CLI Binaries

            Download the appropriate binary for your platform from the assets below.

            ## Quick Start

            ```bash
            # Using Docker Compose
            export INDUS_VERSION=${{ needs.version.outputs.version }}
            docker compose up -d