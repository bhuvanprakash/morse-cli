name: Promote Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag version to promote"
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBECONFIG_B64}" | base64 -d > "$HOME/.kube/config"
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PROD_B64 }}

      - name: Promote release
        run: |
          chmod +x ./deploy/releases/promote.sh
          RELEASE_NAME=indusbase NAMESPACE=indusbase ./deploy/releases/promote.sh "${{ github.event.inputs.version }}"
