apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "indusbase.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.postgresql.storageClass }}
  resources:
    requests:
      storage: {{ .Values.postgresql.storage }}
