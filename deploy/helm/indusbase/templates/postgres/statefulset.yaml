apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "indusbase.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ include "indusbase.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: indus-postgres
  template:
    metadata:
      labels:
        app: indus-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.global.env.DB_NAME | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.secretName }}
                  key: POSTGRES_PASSWORD
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgresql.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}
