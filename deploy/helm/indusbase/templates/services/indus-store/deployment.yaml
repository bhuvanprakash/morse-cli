apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "indusbase.fullname" . }}-store
  namespace: {{ .Release.Namespace }}
  labels:
    app: indus-store
    {{- include "indusbase.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.store.replicas }}
  selector:
    matchLabels:
      app: indus-store
  template:
    metadata:
      labels:
        app: indus-store
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: indus-store
          image: "{{ .Values.global.image.registry }}/indus-store:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: 8005
              name: http
          env:
            - name: SERVER_PORT
              value: "8005"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.secretName }}
                  key: DATABASE_URL
            - name: INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.secretName }}
                  key: INTERNAL_SECRET

          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.services.store.resources | nindent 12 }}
