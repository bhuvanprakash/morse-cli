{{- if .Values.services.auth.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "indusbase.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "indusbase.fullname" . }}-auth
  minReplicas: {{ .Values.services.auth.hpa.minReplicas }}
  maxReplicas: {{ .Values.services.auth.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ default 70 .Values.services.auth.hpa.targetCPUUtilizationPercentage }}
{{- end }}
