apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "indusbase.fullname" . }}-notify
  namespace: {{ .Release.Namespace }}
  labels:
    app: indus-notify
    {{- include "indusbase.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.notify.replicas }}
  selector:
    matchLabels:
      app: indus-notify
  template:
    metadata:
      labels:
        app: indus-notify
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: indus-notify
          image: "{{ .Values.global.image.registry }}/indus-notify:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: 8009
              name: http
          env:
            - name: SERVER_PORT
              value: "8009"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.secretName }}
                  key: DATABASE_URL
            - name: INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.secretName }}
                  key: INTERNAL_SECRET
            - name: AUTH_SERVICE_URL
              value: "http://{{ include "indusbase.fullname" . }}-auth:8001"
            - name: QUEUE_SERVICE_URL
              value: "http://{{ include "indusbase.fullname" . }}-queue:8008"
          livenessProbe:
            httpGet:
              path: /health
              port: 8009
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8009
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.services.notify.resources | nindent 12 }}
