apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "indusbase.fullname" . }}-audit
  namespace: {{ .Release.Namespace }}
  labels:
    app: indus-audit
    {{- include "indusbase.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.audit.replicas }}
  selector:
    matchLabels:
      app: indus-audit
  template:
    metadata:
      labels:
        app: indus-audit
    spec:
      containers:
        - name: indus-audit
          image: "{{ .Values.global.image.registry }}/indus-audit:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: 8011
              name: http
          env:
            - name: SERVER_PORT
              value: "8011"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.secretName }}
                  key: DATABASE_URL
            - name: INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.secretName }}
                  key: INTERNAL_SECRET
          resources:
            {{- toYaml .Values.services.audit.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "indusbase.fullname" . }}-audit
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: indus-audit
  ports:
    - name: http
      port: 8011
      targetPort: 8011
---
