apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "indusbase.fullname" . }}-studio
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.studio.replicas }}
  selector:
    matchLabels:
      app: indus-studio
  template:
    metadata:
      labels:
        app: indus-studio
    spec:
      containers:
        - name: indus-studio
          image: "{{ .Values.global.image.registry }}/indus-studio:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PUBLIC_INDUSBASE_URL
              value: https://{{ .Values.ingress.hosts.api }}
            - name: INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.secretName }}
                  key: INTERNAL_SECRET
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.studio.resources | nindent 12 }}
