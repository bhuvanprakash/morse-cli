name: Deploy to Production

on:
  push:
    tags: ['v*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v3
        with:
          version: v3.14.0
      - uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
      - run: |
          helm upgrade --install indusbase ./deploy/helm/indusbase \
            --namespace indusbase \
            --create-namespace \
            --values ./deploy/helm/indusbase/values.yaml \
            --values ./deploy/helm/indusbase/values.prod.yaml \
            --set global.image.tag=${{ github.ref_name }} \
            --wait \
            --timeout 10m
      - run: |
          kubectl rollout status deployment/indusbase-gate -n indusbase
          kubectl rollout status deployment/indusbase-auth -n indusbase
      - run: |
          sleep 30
          curl -f https://api.indusbase.com/health
